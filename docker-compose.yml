# Sobe tudo com um comando:  docker compose up -d --build
#   web  → http://localhost:3000
#   api  → http://localhost:3333 (Swagger em /api-docs)
#   postgres → localhost:5432 (nexo/nexo)
# A chave do modelo (ex.: ANTHROPIC_API_KEY ou OPENAI_API_KEY) vem de apps/api/.env.

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo
      POSTGRES_DB: nexo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nexo_api
    restart: unless-stopped
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3333
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: nexo
      DB_PASSWORD: nexo
      DB_NAME: nexo
      CORS_ORIGIN: http://localhost:3000
      # Valor só para rodar localmente; em produção defina JWT_SECRET no ambiente.
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-change-me-0123456789}
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: nexo_web
    restart: unless-stopped
    environment:
      # O web fala com a API pela rede interna do compose.
      API_URL: http://api:3333
      # Acesso por http://localhost: cookies sem a flag Secure.
      INSECURE_COOKIES: "true"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
